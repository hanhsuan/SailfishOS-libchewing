name: Build rpm package

on:
  workflow_dispatch:
    inputs:
      release_tag:
        type: string
        description: 'The release tag defined in https://hub.docker.com/r/coderus/sailfishos-platform-sdk/tags'
        default: '5.2.0.15'
      package_tag:
        type: string
        description: 'The tag will be used for the release'
        default: 'v0.8.5'
      publish:
        type: boolean
        description: 'Upload rpms to github or not'
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        arch: ["armv7hl", "aarch64", "i486"]

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: true
    - name: Prepare
      shell: bash
      run: |
        cp -r rpm libchewing
        patch libchewing/doc/CMakeLists.txt libchewing/rpm/0001-skip-chewing-cli-doc.patch
        cp -r libchewing/* ${GITHUB_WORKSPACE}
    - name: Build ${{ matrix.arch }}
      uses: coderus/github-sfos-build@sfos5
      with:
        release: ${{ github.event.inputs.release_tag }}
        arch: ${{ matrix.arch }}
    - name: Check Result
      shell: bash
      run: |
        echo $(pwd)
        ls -ltra RPMS
    - name: Create release
      if: ${{ fromJson(github.event.inputs.publish) }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PK_TAG: ${{ github.event.inputs.package_tag }}
        RELEASE: ${{ github.event.inputs.release_tag }}
      run: |
        set -x
        assets=()
        for asset in RPMS/*.rpm; do
          assets+=("$asset")
        done
        if gh release view "${RELEASE}-${PK_TAG}" >/dev/null 2>&1; then
          gh release upload "${RELEASE}-${PK_TAG}" "${assets[@]}"
        else
          gh release create "${RELEASE}-${PK_TAG}" "${assets[@]}" --title "${RELEASE}-${PK_TAG}"
        fi
